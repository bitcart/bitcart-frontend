name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    uses: bitcart/bitcart-actions/.github/workflows/lint.yml@master
    with:
      setup-node: true
      verbose: true
      nx-cache: true
      setup-just: true
      extra-checks: |
        just unit
        just api-check

  workflows:
    name: workflows
    uses: bitcart/bitcart-actions/.github/workflows/workflow-checks.yml@master

    permissions:
      contents: read
      security-events: write # needed for github advanced security

  e2e:
    name: e2e
    needs: [lint, workflows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: bitcart/bitcart-actions/actions/setup-node@master

      - name: Cache Nx
        uses: bitcart/bitcart-actions/actions/nx-cache@master

      - name: Set up Just
        uses: bitcart/bitcart-actions/actions/setup-just@master

      - name: Configure Fast APT Mirror
        uses: bitcart/bitcart-actions/actions/fast-apt-mirror@master

      - name: Install Playwright browsers
        run: just e2e-setup

      - name: Run E2E tests
        run: just e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: |
            apps/*/e2e/playwright-report/
            apps/*/e2e/screenshots/
          retention-days: 1

  upload-e2e-artifacts:
    name: upload-${{ matrix.app }}-e2e-artifacts
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [landing, directory, checkout, blog]

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.app }}
          path: ${{ matrix.app }}/e2e/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.app }}
          path: ${{ matrix.app }}/e2e/screenshots/
          retention-days: 14
