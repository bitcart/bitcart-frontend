name: UI Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ui-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write # to publish on github pages
      id-token: write # OIDC token for pages deployment

    env:
      BITCART_ENV: production

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: bitcart/bitcart-actions/actions/setup-node@master

      - name: Restore Nx cache
        id: nx-cache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nx
          key: v1-nx-${{ github.ref_name }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            v1-nx-${{ github.ref_name }}-

      - name: Set up Python
        uses: bitcart/bitcart-actions/actions/setup-python@master
        with:
          cache-dependency-glob: ""

      - name: Install just
        run: uv pip install rust-just

      - name: Set up GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build UI Docs
        run: just build -p ui-docs

      - name: Create SPA fallback page
        # All docs routes are prerendered, but unknown URLs still need the SPA shell.
        # TanStack Start emits it as _shell.html and expects the host to rewrite to it;
        # GitHub Pages can't rewrite, so serve the shell as the 404 fallback instead.
        run: cp apps/ui-docs/.output/public/_shell.html apps/ui-docs/.output/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/ui-docs/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Save Nx cache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nx
          key: ${{ steps.nx-cache-restore.outputs.cache-primary-key }}
