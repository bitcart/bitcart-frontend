name: Deploy Sites

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pull-locales:
    name: pull-locales
    runs-on: ubuntu-latest
    environment: transifex

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Transifex CLI
        uses: $/.github/actions/install-transifex

      - name: Set up Just
        uses: bitcart/bitcart-actions/actions/setup-just@master

      - name: Pull translations from Transifex
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: just locales-pull

      - name: Upload translations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locales
          path: |
            apps/**/*.po
            packages/**/*.po
          if-no-files-found: error
          retention-days: 1

  build:
    name: build
    needs: pull-locales
    runs-on: ubuntu-latest
    environment: sites-build

    env:
      BITCART_ENV: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download translations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locales

      - name: Set up Node.js
        uses: bitcart/bitcart-actions/actions/setup-node@master

      - name: Set up Just
        uses: bitcart/bitcart-actions/actions/setup-just@master

      - name: Configure Plausible
        env:
          PLAUSIBLE_ENDPOINT: ${{ secrets.BITCART_PLAUSIBLE_ENDPOINT }}
        run: |
          : "${PLAUSIBLE_ENDPOINT:?The sites-build environment has no BITCART_PLAUSIBLE_ENDPOINT secret}"
          {
            echo "BITCART_PLAUSIBLE_ENABLED=true"
            echo "BITCART_PLAUSIBLE_ENDPOINT=$PLAUSIBLE_ENDPOINT"
          } >> .env

      - name: Build sites
        run: just build --outputStyle=stream -p @bitcart/landing @bitcart/directory @bitcart/blog

      - name: Upload sites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sites
          path: |
            apps/landing/dist/client/
            apps/directory/dist/client/
            apps/blog/.output/public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment: netlify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download sites
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sites
          path: apps

      - name: Set up Node.js
        uses: bitcart/bitcart-actions/actions/setup-node@master
        with:
          install: false

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          deploy() {
            scripts/deploy-netlify.ts "$1" "apps/$2/$3" "apps/$2/netlify.toml" --message "$GITHUB_SHA"
          }
          deploy bitcartcc landing dist/client
          deploy bitcart-directory directory dist/client
          deploy bitcart-blog blog .output/public
