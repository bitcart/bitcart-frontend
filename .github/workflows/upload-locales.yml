name: Upload Locales

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  upload-locales:
    name: upload-locales
    runs-on: ubuntu-latest
    environment: transifex

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: bitcart/bitcart-actions/actions/setup-node@master

      - name: Set up Just
        uses: bitcart/bitcart-actions/actions/setup-just@master

      - name: Build packages
        run: just build-packages

      - name: Extract locales
        run: just locales-extract

      - name: Install Transifex CLI
        uses: $/.github/actions/install-transifex

      - name: Push source locales to Transifex
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: just locales-push
