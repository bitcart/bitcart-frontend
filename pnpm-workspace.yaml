  - "@oxlint/binding-*"
  - "@oxlint-tsgolint/*"
  - "@oxc-project/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - "@base-ui/*"

overrides:
  # TODO: Remove once orval bumps its js-yaml pin to 4.3.2.
  js-yaml: ^4.3.2

  # TODO: Remove once nx bumps its smol-toml pin to 1.7.1.
  "nx>smol-toml": ^1.7.1

peerDependencyRules:
  allowedVersions:
    #* @qalisa/vike-plugin-sitemap@1.7.0 still declares `vite: ^6`, but its
    #* source only uses stable Vite plugin APIs and works fine on vite 8.
    # TODO: Remove once upstream widens the peer range (https://github.com/Qalisa/vike-plugin-sitemap)
    "@qalisa/vike-plugin-sitemap>vite": "8"
