packages:
  - ./apps/*
  - ./packages/*
  - ./templates/*

allowBuilds:
  esbuild: true
  lightningcss: true
  nx: true

  #* msw's postinstall only copies the browser service worker into a public directory,
  #* which is meaningless from inside a workspace package. Generated handlers are consumed
  #* through `setupServer`; run `msw init` explicitly if browser-side mocking is ever needed.
  msw: false

catalogMode: strict

