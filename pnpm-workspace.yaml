packages:
  - ./apps/*
  - ./packages/*
  - ./templates/*

allowBuilds:
  esbuild: true
  nx: true

catalogMode: strict

catalogs:
  dependencies:
    "@base-ui/react": 1.7.0
    "@daypicker/react": 10.0.1
    "@lingui/core": 6.6.0
    "@lingui/react": 6.6.0
    "@mantine/hooks": 9.5.1
    "@phosphor-icons/react": 2.1.10
    "@t3-oss/env-core": 0.13.11
    "@tanstack/react-form": 1.33.3
    "@tanstack/react-query": 5.101.4
    "@web3icons/react": 4.1.20
    class-variance-authority: 0.7.1
    dotenv: 17.4.2
    effect: 3.22.1
    inter-ui: 4.1.1
    lucide-react: 1.28.0
    next-themes: 0.4.6
    react: 19.2.8
    react-dom: 19.2.8
    remeda: 2.39.0
    sonner: 2.0.7
    tailwind-merge: 3.6.0
    vike: 0.4.260
    vike-react: 0.6.25
    vike-react-query: 0.1.13
    zod: 4.4.3
  devDependencies:
    "@effect/language-service": 0.87.1
    "@lingui/babel-plugin-lingui-macro": 6.6.0
    "@lingui/cli": 6.6.0
    "@lingui/conf": 6.6.0
    "@lingui/vite-plugin": 6.6.0
    "@playwright/test": 1.62.1
    "@qalisa/vike-plugin-sitemap": 1.7.0
    "@rolldown/plugin-babel": 0.2.3
    "@stylistic/eslint-plugin": 5.10.0
    "@testing-library/dom": 10.4.1
    "@testing-library/jest-dom": 6.9.1
    "@testing-library/react": 16.3.2
    "@testing-library/user-event": 14.6.1
    "@types/node": 25.9.5
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.4
    "@unocss/cli": 66.7.5
    "@vitejs/plugin-react": 6.0.5
    babel-plugin-react-compiler: 1.0.0
    dependency-cruiser: 18.1.1
    eslint-plugin-better-tailwindcss: 4.7.0
    eslint-plugin-react-hooks: 7.1.1
    jsdom: 29.1.1
    knip: 6.31.0
    nx: 22.7.8
    oxfmt: 0.62.0
    oxlint: 1.77.0
    oxlint-tsgolint: 7.0.2001
    tailwindcss: 4.3.3
    tsdown: 0.22.14
    tsx: 4.23.5
    typescript: 6.0.3
    unocss: 66.7.5
    unocss-preset-animations: 1.3.0
    unocss-preset-shadcn: 1.0.1
    vite: 8.2.0
    vite-plugin-static-copy: 4.1.1
    vite-plugin-svgr: 5.2.0
    vitest: 4.1.10

linkWorkspacePackages: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@oxfmt/binding-*"
  - "@oxlint/binding-*"
  - "@oxlint-tsgolint/*"
  - "@oxc-project/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - "@base-ui/*"

  # TODO: Remove after Aug 10 2026
  - nanoid@3.3.17

overrides:
  #* minimatch@10 and nx pin brace-expansion below 5.0.9, which still carries
  #* a high-severity ReDoS advisory.
  # TODO: Remove once minimatch/nx bump their brace-expansion floor to 5.0.9.
  brace-expansion: ^5.0.9

  #* postcss pins nanoid ^3.3.16, below 3.3.17 which patches a high-severity
  #* advisory where custom generators loop indefinitely on zero size. postcss's
  #* own range already allows the patched release.
  # TODO: Remove once postcss raises its nanoid floor to 3.3.17.
  nanoid: ^3.3.17

peerDependencyRules:
  allowedVersions:
    #* @qalisa/vike-plugin-sitemap@1.7.0 still declares `vite: ^6`, but its
    #* source only uses stable Vite plugin APIs and works fine on vite 8.
    # TODO: Remove once upstream widens the peer range (https://github.com/Qalisa/vike-plugin-sitemap)
    "@qalisa/vike-plugin-sitemap>vite": "8"
