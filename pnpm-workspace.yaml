  - oxlint-tsgolint
  - "@base-ui/*"

overrides:
  #* nx exact-pins brace-expansion 5.0.8, which still carries a high-severity ReDoS
  #* advisory. Scoped to nx rather than workspace-wide: minimatch@10's own ranges
  #* (^5.0.5, ^5.0.8) already resolve to the patched 5.0.9, while a global pin would
  #* also force v5 into minimatch@3 (via serve-handler), whose ^1.1.7 resolves to the
  #* patched 1.1.18 and whose `require('brace-expansion')` needs v1's callable export.
  # TODO: Remove once nx bumps its brace-expansion pin to 5.0.9.
  "nx>brace-expansion": ^5.0.9

  #* @tanstack/start-static-server-functions exact-pins an older start-client-core
  #* than the rest of the Start stack resolves, so two copies land in the tree.
  #* Their middleware typings are identical, but `TSS_SERVER_FUNCTION_FACTORY` is a
  #* `unique symbol` per copy, making `staticFunctionMiddleware` nominally
  #* unassignable to `.middleware()`. Runtime is unaffected (`Symbol.for` resolves
  #* through the global registry) -- this only ever broke typecheck.
  # TODO: Remove once upstream ships both packages against one start-client-core.
  "@tanstack/start-static-server-functions>@tanstack/start-client-core": 1.170.21

peerDependencyRules:
  allowedVersions:
    #* @qalisa/vike-plugin-sitemap@1.7.0 still declares `vite: ^6`, but its
    #* source only uses stable Vite plugin APIs and works fine on vite 8.
    # TODO: Remove once upstream widens the peer range (https://github.com/Qalisa/vike-plugin-sitemap)
    "@qalisa/vike-plugin-sitemap>vite": "8"
