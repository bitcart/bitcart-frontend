packages:
  - ./apps/*
  - ./packages/*

allowBuilds:
  esbuild: true
  nx: true

catalogMode: strict

catalogs:
  dependencies:
    "@base-ui/react": 1.6.0
    "@daypicker/react": 10.0.1
    "@lingui/core": 6.5.0
    "@lingui/react": 6.5.0
    "@mantine/hooks": 9.4.1
    "@phosphor-icons/react": 2.1.10
    "@t3-oss/env-core": 0.13.11
    "@tanstack/react-form": 1.33.2
    "@tanstack/react-query": 5.101.2
    "@web3icons/react": 4.1.19
    class-variance-authority: 0.7.1
    dotenv: 17.4.2
    effect: 3.22.0
    inter-ui: 4.1.1
    lucide-react: 1.25.0
    next-themes: 0.4.6
    react: 19.2.7
    react-dom: 19.2.7
    remeda: 2.39.0
    sonner: 2.0.7
    tailwind-merge: 3.6.0
    vike: 0.4.260
    vike-react: 0.6.25
    vike-react-query: 0.1.13
    zod: 4.4.3
  devDependencies:
    "@effect/language-service": 0.87.0
    "@lingui/babel-plugin-lingui-macro": 6.5.0
    "@lingui/cli": 6.5.0
    "@lingui/conf": 6.5.0
    "@lingui/vite-plugin": 6.5.0
    "@playwright/test": 1.61.1
    "@qalisa/vike-plugin-sitemap": 1.7.0
    "@rolldown/plugin-babel": 0.2.3
    "@stylistic/eslint-plugin": 5.10.0
    "@types/node": 25.9.5
    "@types/react": 19.2.17
    "@types/react-dom": 19.2.3
    "@unocss/cli": 66.7.5
    "@vitejs/plugin-react": 6.0.3
    babel-plugin-react-compiler: 1.0.0
    dependency-cruiser: 18.1.0
    eslint-plugin-better-tailwindcss: 4.7.0
    eslint-plugin-react-hooks: 7.1.1
    knip: 6.27.0
    nx: 22.7.7
    oxfmt: 0.60.0
    oxlint: 1.75.0
    oxlint-tsgolint: 7.0.2001
    tailwindcss: 4.3.3
    tsdown: 0.22.12
    tsx: 4.23.1
    typescript: 6.0.3
    unocss: 66.7.5
    unocss-preset-animations: 1.3.0
    unocss-preset-shadcn: 1.0.1
    vite: 8.1.5
    vite-plugin-static-copy: 4.1.1
    vite-plugin-svgr: 5.2.0

linkWorkspacePackages: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@oxfmt/binding-*"
  - "@oxlint/binding-*"
  - "@oxlint-tsgolint/*"
  - "@oxc-project/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - "@base-ui/*"

  # TODO: Remove after Jul 30 2026
  - brace-expansion@5.0.8

overrides:
  #* nx@22.x pins axios 1.16.0, which carries 7 advisories (prototype pollution,
  #* maxBodyLength bypass, NO_PROXY bypass and more), all fixed only in 1.18.0.
  # TODO: Remove once nx bumps its bundled axios past 1.18.0.
  axios: ^1.18.0

  #* minimatch@10 and nx pin brace-expansion below 5.0.8, which still carries
  #* two high-severity ReDoS advisories.
  # TODO: Remove once minimatch/nx bump their brace-expansion floor to 5.0.8.
  brace-expansion: ^5.0.8

  #* cosmiconfig@8 (via vite-plugin-svgr > @svgr/core) allows js-yaml ^4.1.0,
  #* but only 4.3.0 patches the prototype-pollution advisory.
  # TODO: Remove once cosmiconfig raises its js-yaml floor to 4.3.0.
  js-yaml: ^4.3.0

peerDependencyRules:
  allowedVersions:
    #* @qalisa/vike-plugin-sitemap@1.7.0 still declares `vite: ^6`, but its
    #* source only uses stable Vite plugin APIs and works fine on vite 8.
    # TODO: Remove once upstream widens the peer range (https://github.com/Qalisa/vike-plugin-sitemap)
    "@qalisa/vike-plugin-sitemap>vite": "8"
