packages:
  - ./apps/*
  - ./packages/*

allowBuilds:
  esbuild: true
  nx: true

catalogMode: strict

catalogs:
  dependencies:
    "@base-ui/react": 1.5.0
    "@daypicker/react": 10.0.1
    "@lingui/core": 6.1.0
    "@lingui/react": 6.1.0
    "@mantine/hooks": 9.2.2
    "@phosphor-icons/react": 2.1.10
    "@t3-oss/env-core": 0.13.11
    "@tanstack/react-form": 1.33.0
    "@tanstack/react-query": 5.100.14
    "@web3icons/react": 4.1.17
    class-variance-authority: 0.7.1
    dotenv: 17.4.2
    effect: 3.21.2
    inter-ui: 4.1.1
    lucide-react: 1.17.0
    next-themes: 0.4.6
    react: 19.2.6
    react-dom: 19.2.6
    remeda: 2.37.0
    sonner: 2.0.7
    tailwind-merge: 3.6.0
    vike: 0.4.259
    vike-react: 0.6.23
    vike-react-query: 0.1.13
    zod: 4.4.3
  devDependencies:
    "@effect/language-service": 0.86.2
    "@lingui/babel-plugin-lingui-macro": 6.1.0
    "@lingui/cli": 6.1.0
    "@lingui/conf": 6.1.0
    "@lingui/vite-plugin": 6.1.0
    "@playwright/test": 1.60.0
    "@qalisa/vike-plugin-sitemap": 1.7.0
    "@rolldown/plugin-babel": 0.2.3
    "@stylistic/eslint-plugin": 5.10.0
    "@types/node": 25.9.1
    "@types/react": 19.2.15
    "@types/react-dom": 19.2.3
    "@unocss/cli": 66.7.0
    "@vitejs/plugin-react": 6.0.2
    babel-plugin-react-compiler: 1.0.0
    dependency-cruiser: 17.4.3
    eslint-plugin-better-tailwindcss: 4.5.0
    eslint-plugin-react-hooks: 7.1.1
    knip: 6.15.0
    nx: 22.7.5
    oxfmt: 0.53.0
    oxlint: 1.68.0
    oxlint-tsgolint: 0.23.0
    tailwindcss: 4.3.0
    tsdown: 0.22.1
    tsx: 4.22.4
    typescript: 6.0.3
    unocss: 66.7.0
    unocss-preset-animations: 1.3.0
    unocss-preset-shadcn: 1.0.1
    vite: 8.0.16
    vite-plugin-static-copy: 4.1.0
    vite-plugin-svgr: 5.2.0

linkWorkspacePackages: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@oxfmt/binding-*"
  - "@oxlint/binding-*"
  - "@oxlint-tsgolint/*"
  - "@oxc-project/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - "@base-ui/*"
  # TODO: Remove after Jun 20 2026
  - "@esbuild/*"
  - esbuild@0.28.1
  # TODO: Remove after Jun 19 2026
  - form-data@4.0.6

overrides:
  #* nx@22.7.x bundles vulnerable versions of these transitive deps.
  #* Override to force patched versions.
  # TODO: Remove these overrides once nx upgrades its bundled dependencies.
  brace-expansion: ^5.0.5
  yaml: ^2.8.3
  follow-redirects: ^1.16.0
  axios: ^1.15.2
  esbuild: ^0.28.1
  tmp: ^0.2.7
  form-data: ^4.0.6

peerDependencyRules:
  allowedVersions:
    #* @qalisa/vike-plugin-sitemap@1.7.0 still declares `vite: ^6`, but its
    #* source only uses stable Vite plugin APIs and works fine on vite 8.
    # TODO: Remove once upstream widens the peer range (https://github.com/Qalisa/vike-plugin-sitemap)
    "@qalisa/vike-plugin-sitemap>vite": "8"
    #* @web3icons/common ships pre-compiled .d.ts files; the `typescript: ^5`
    #* peer is purely a declared range and TS 6 consumes the types fine.
    # TODO: Remove once upstream widens the peer range (https://github.com/0xa3k5/web3icons)
    "@web3icons/common>typescript": "6"
