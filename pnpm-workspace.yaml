linkWorkspacePackages: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - "@oxfmt/binding-*"
  - "@oxlint/binding-*"
  - "@oxlint-tsgolint/*"
  - "@oxc-project/*"
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - "@base-ui/*"

  # TODO: Remove after 2026-10-26
  - fast-uri@3.1.9

overrides:
  # TODO: Remove once nx bumps its undici pin to 7.30.1.
  "nx>undici": ^7.30.1

  # TODO: Remove once @scalar/json-magic bumps its undici pin to 7.30.1.
  "@scalar/json-magic>undici": ^7.30.1

  # TODO: Remove once minimatch bumps its brace-expansion floor to 5.0.12.
  "minimatch@10>brace-expansion": ^5.0.12

  # TODO: Remove once ajv bumps its fast-uri floor to 3.1.9.
  "ajv>fast-uri": ^3.1.9

  # TODO: Remove once css-tree, @eslint/css-tree and @tailwindcss/node bump their source-map-js floor to 1.2.2.
  source-map-js: ^1.2.2

  # TODO: Remove once serve bumps its compression pin to 1.8.2.
  "serve>compression": ^1.8.2

  # TODO: Remove once launch-editor bumps its shell-quote floor to 1.11.0.
  "launch-editor>shell-quote": ^1.11.0

packageExtensions:
  dependency-cruiser:
    dependencies:
      #! dependency-cruiser parses TypeScript through the compiler API that TypeScript 7 no longer
      #! ships. Against TS 7 it cruises zero modules and still reports success.
      # TODO: Remove once dependency-cruiser supports TypeScript 7 (https://github.com/sverweij/dependency-cruiser)
      typescript: npm:@typescript/typescript6@6.0.2

peerDependencyRules:
  allowedVersions:
    #* @qalisa/vike-plugin-sitemap@1.7.0 still declares `vite: ^6`, but its
    #* source only uses stable Vite plugin APIs and works fine on vite 8.
    # TODO: Remove once upstream widens the peer range (https://github.com/Qalisa/vike-plugin-sitemap)
    "@qalisa/vike-plugin-sitemap>vite": "8"

    #* @vitest/mocker@5.0.2 still declares the optional peer `msw: ^2.4.9`, but its main branch
    #* already accepts msw 3, and only browser mode uses it.
    # TODO: Remove once a vitest release ships https://github.com/vitest-dev/vitest/pull/11482
    "@vitest/mocker>msw": "3"
