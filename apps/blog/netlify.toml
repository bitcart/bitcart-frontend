[[redirects]]
from = "https://blog.bitcartcc.com/*"
to = "https://blog.bitcart.ai/:splat"
status = 301
force = true

[build]
publish = "./apps/blog/.output/public"
command = "BITCART_ENV=production just build --outputStyle=stream -p @bitcart/blog"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
